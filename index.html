<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Doc Editor | Live Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        p { color: #94a3b8; margin-top: 8px; }

        .controls {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        button {
            background: var(--primary);
            color: var(--bg);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .editor-container {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        textarea {
            width: 100%;
            height: 400px;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .status { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
        .dot.connected { background: #10b981; box-shadow: 0 0 12px #10b981; }

        .log-container {
            margin-top: 30px;
        }

        .log-header {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        .log {
            background: #000;
            padding: 20px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border);
            color: #10b981;
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Real-Time Sync</h1>
        <p>Phase 2 Distributed Architecture</p>
    </header>

    <div class="controls">
        <input type="text" id="docId" placeholder="Document ID" value="">
        <input type="number" id="userId" placeholder="User ID" style="flex: 0.3" value="1">
        <button id="connectBtn" onclick="connect()">Connect & Sync</button>
    </div>

    <div class="editor-container">
        <textarea id="editor" placeholder="Connect to a document to start editing..." disabled></textarea>
        <div class="status-bar">
            <div class="status">
                <div id="dot" class="dot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <div id="revCounter">Revision: 0</div>
        </div>
    </div>

    <div class="log-container">
        <div class="log-header">
            <span>Activity Log</span>
            <span style="cursor:pointer" onclick="document.getElementById('log').innerHTML=''">Clear</span>
        </div>
        <div class="log" id="log">
            [System] Ready...
        </div>
    </div>
</div>

<script>
    let socket;
    let userId;
    const editor = document.getElementById('editor');
    const log = document.getElementById('log');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const revCounter = document.getElementById('revCounter');

    function addLog(msg, type='info') {
        const div = document.createElement('div');
        const color = type === 'error' ? '#ef4444' : (type === 'receive' ? '#38bdf8' : '#10b981');
        div.style.color = color;
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        log.prepend(div);
    }

    function applyOperation(text, op) {
        if (op.op_type === "insert") {
            return text.slice(0, op.position) + op.content + text.slice(op.position);
        } else if (op.op_type === "delete") {
            return text.slice(0, op.position) + text.slice(op.position + 1);
        }
        return text;
    }

    async function connect() {
        const docId = document.getElementById('docId').value;
        userId = parseInt(document.getElementById('userId').value);
        
        if (!docId) return alert("Please enter a Document ID");

        try {
            // 1. Initial Sync
            addLog(`Syncing document ${docId}...`);
            const res = await fetch(`http://localhost:8001/documents/${docId}`);
            if (!res.ok) throw new Error("Document not found");
            const data = await res.json();
            editor.value = data.content || "";
            addLog("Initial state synchronized.");

            // 2. Open Websocket
            socket = new WebSocket(`ws://localhost:8001/ws/${docId}`);

            socket.onopen = () => {
                dot.classList.add('connected');
                statusText.textContent = "Connected";
                editor.disabled = false;
                document.getElementById('connectBtn').disabled = true;
                addLog("WebSocket established.");
            };

            socket.onmessage = (event) => {
                const op = JSON.parse(event.data);
                revCounter.textContent = `Revision: ${op.revision}`;

                // Only apply if it's from ANOTHER user
                if (op.user_id !== userId) {
                    addLog(`Remote ${op.op_type} at ${op.position}`, 'receive');
                    
                    const cursor = editor.selectionStart;
                    editor.value = applyOperation(editor.value, op);
                    
                    // Adjust cursor if change was BEFORE our cursor
                    const newCursor = op.position < cursor ? (op.op_type === 'insert' ? cursor + 1 : cursor - 1) : cursor;
                    editor.setSelectionRange(newCursor, newCursor);
                }
            };

            socket.onclose = () => {
                dot.classList.remove('connected');
                statusText.textContent = "Disconnected";
                editor.disabled = true;
                addLog("Connection lost.", 'error');
            };

        } catch (err) {
            addLog(err.message, 'error');
        }
    }

    // Listen for typing
    editor.oninput = (e) => {
        let opType, position, content;

        if (e.inputType === "deleteContentBackward") {
            opType = "delete";
            position = editor.selectionStart;
            content = null;
        } else {
            opType = "insert";
            position = editor.selectionStart - 1;
            content = e.data;
        }

        const op = {
            user_id: userId,
            op_type: opType,
            position: position,
            content: content
        };

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify(op));
        }
    };
</script>

</body>
</html>
