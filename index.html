<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Doc Editor | Google Docs Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.5rem; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }

        .controls {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; }
        button { background: var(--primary); color: var(--bg); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }

        .editor-wrapper {
            position: relative;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        textarea, #mirror {
            width: 100%;
            height: 450px;
            padding: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            line-height: 1.6;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        textarea {
            background: transparent;
            border: none;
            color: var(--text);
            resize: none;
            outline: none;
            position: relative;
            z-index: 2;
        }

        /* The Mirror Div is hidden but used for calculation */
        #mirror {
            position: absolute;
            top: 0;
            left: 0;
            visibility: hidden;
            z-index: -1;
        }

        .remote-cursor {
            position: absolute;
            width: 2px;
            height: 1.4em;
            pointer-events: none;
            z-index: 3;
            transition: all 0.1s ease-out;
        }

        .cursor-label {
            position: absolute;
            top: -20px;
            left: 0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            white-space: nowrap;
            color: white;
        }

        .log { margin-top: 20px; background: #000; padding: 15px; border-radius: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; height: 100px; overflow-y: auto; border: 1px solid var(--border); color: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CloudDocs OT</h1>
        <p>Phase 4: Real-Time Presence (Google Mode)</p>
    </header>

    <div class="controls">
        <input type="text" id="docId" placeholder="Document ID">
        <input type="number" id="userId" placeholder="User ID" style="flex: 0.3" value="1">
        <button onclick="connect()">Connect</button>
    </div>

    <div class="editor-wrapper" id="wrapper">
        <textarea id="editor" disabled></textarea>
        <div id="mirror"></div>
        <!-- Cursors will be injected here -->
    </div>

    <div class="log" id="log">Ready...</div>
</div>

<script>
    let socket;
    let userId;
    let currentRevision = 0;
    let pendingOps = [];
    let cursors = {};

    const editor = document.getElementById('editor');
    const mirror = document.getElementById('mirror');
    const wrapper = document.getElementById('wrapper');
    const log = document.getElementById('log');

    const COLORS = ['#ef4444', '#38bdf8', '#10b981', '#f59e0b', '#818cf8', '#ec4899'];

    function getCursorXY(pos) {
        const text = editor.value;
        const before = text.substring(0, pos);
        const after = text.substring(pos);
        
        // We inject a span at the cursor position into our hidden mirror
        mirror.textContent = before;
        const span = document.createElement('span');
        span.textContent = '|'; // Placeholder
        mirror.appendChild(span);
        
        const { offsetLeft, offsetTop } = span;
        return { x: offsetLeft, y: offsetTop };
    }

    function updateRemoteCursor(data) {
        if (data.user_id === userId) return;

        let cursorEl = document.getElementById(`cursor-${data.user_id}`);
        if (!cursorEl) {
            cursorEl = document.createElement('div');
            cursorEl.id = `cursor-${data.user_id}`;
            cursorEl.className = 'remote-cursor';
            const label = document.createElement('div');
            label.className = 'cursor-label';
            label.textContent = `User ${data.user_id}`;
            cursorEl.appendChild(label);
            wrapper.appendChild(cursorEl);
        }

        const color = COLORS[data.user_id % COLORS.length];
        cursorEl.style.backgroundColor = color;
        cursorEl.querySelector('.cursor-label').style.backgroundColor = color;

        const coords = getCursorXY(data.pos);
        cursorEl.style.left = `${coords.x}px`;
        cursorEl.style.top = `${coords.y}px`;
    }

    // --- OT ENGINE (Same as before) ---
    function transform(incoming, base) {
        let newPos = incoming.position;
        if (incoming.op_type === "insert") {
            if (base.op_type === "insert") {
                if (base.position < incoming.position) newPos += (base.content ? base.content.length : 0);
                else if (base.position === incoming.position && incoming.user_id > base.user_id) newPos += (base.content ? base.content.length : 0);
            } else if (base.op_type === "delete" && base.position < incoming.position) newPos -= 1;
        } else if (incoming.op_type === "delete") {
            if (base.op_type === "insert" && base.position <= incoming.position) newPos += (base.content ? base.content.length : 0);
            else if (base.op_type === "delete" && base.position < incoming.position) newPos -= 1;
            else if (base.op_type === "delete" && base.position === incoming.position) return null;
        }
        return { ...incoming, position: newPos };
    }

    async function connect() {
        const docId = document.getElementById('docId').value;
        userId = parseInt(document.getElementById('userId').value);
        if (!docId) return;

        const res = await fetch(`http://localhost:8001/documents/${docId}`);
        const data = await res.json();
        editor.value = data.content || "";
        currentRevision = data.revision || 0;

        socket = new WebSocket(`ws://localhost:8001/ws/${docId}`);
        socket.onopen = () => { editor.disabled = false; sendCursorUpdate(); };

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === "cursor") {
                updateRemoteCursor(msg);
                return;
            }

            const op = msg;
            if (op.revision <= currentRevision && op.user_id !== userId) return;
            
            if (op.user_id !== userId) {
                currentRevision = op.revision;
                let transformedOp = op;
                for (let pending of pendingOps) {
                    transformedOp = transform(transformedOp, pending);
                    if (!transformedOp) break;
                }
                if (transformedOp) {
                    const cursor = editor.selectionStart;
                    editor.value = text = transformedOp.op_type === "insert" 
                        ? editor.value.slice(0, transformedOp.position) + transformedOp.content + editor.value.slice(transformedOp.position)
                        : editor.value.slice(0, transformedOp.position) + editor.value.slice(transformedOp.position + 1);
                    
                    const newCursor = transformedOp.position < cursor ? (transformedOp.op_type === 'insert' ? cursor + 1 : cursor - 1) : cursor;
                    editor.setSelectionRange(newCursor, newCursor);
                }
            } else {
                currentRevision = op.revision;
                pendingOps.shift();
            }
        };
    }

    function sendCursorUpdate() {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "cursor", user_id: userId, pos: editor.selectionStart }));
        }
    }

    editor.oninput = (e) => {
        let opType = e.inputType === "deleteContentBackward" ? "delete" : "insert";
        let position = editor.selectionStart - (opType === "insert" ? 1 : 0);
        let content = opType === "insert" ? e.data : null;
        const op = { user_id: userId, op_type: opType, position: position, content: content, revision: currentRevision };
        pendingOps.push(op);
        socket.send(JSON.stringify(op));
        sendCursorUpdate();
    };
    editor.onkeyup = editor.onclick = sendCursorUpdate;
</script>
</body>
</html>
